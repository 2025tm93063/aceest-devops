<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add User – ACEest</title>
  <style>
    body { background:#1a1a1a; color:#fff; font-family:Arial,sans-serif; }
    header { background:#d4af37; color:#000; padding:20px 30px; display:flex; justify-content:space-between; }
    header h1 { font-size:22px; }
    header a { color:#000; text-decoration:none; font-weight:bold; }
    .container { max-width:500px; margin:40px auto; padding:0 20px; }
    .card { background:#222; padding:30px; border-radius:10px; }
    label { display:block; margin-top:15px; margin-bottom:5px; color:#ccc; }
    input, select { width:100%; padding:10px; background:#333; border:1px solid #555; color:#fff; border-radius:5px; }
    .btn { margin-top:25px; padding:12px 30px; background:#d4af37; color:#000; font-weight:bold; border:none; border-radius:5px; cursor:pointer; font-size:15px; }
    .flash { background:#27ae60; color:#fff; padding:10px; border-radius:5px; margin-bottom:15px; }
  </style>
</head>
<body>
  <header><h1>Add System User</h1><a href="{{ url_for('dashboard') }}">← Dashboard</a></header>
  <div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <div class="card">
      <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <label>Role</label>
        <select name="role">
          <option value="Trainer">Trainer</option>
          <option value="Admin">Admin</option>
        </select>
        <button type="submit" class="btn">Create User</button>
      </form>
    </div>
  </div>
</body>
</html>
