<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ACEest Login</title>
  <style>
    body { background:#1a1a1a; color:#fff; font-family:Arial,sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .card { background:#222; padding:40px; border-radius:10px; width:360px; box-shadow:0 0 20px #000; }
    h1 { color:#d4af37; text-align:center; margin-bottom:30px; }
    label { display:block; margin-top:15px; margin-bottom:5px; color:#ccc; }
    input { width:100%; padding:10px; background:#333; border:1px solid #555; color:#fff; border-radius:5px; box-sizing:border-box; }
    button { width:100%; margin-top:25px; padding:12px; background:#d4af37; color:#000; font-weight:bold; border:none; border-radius:5px; cursor:pointer; font-size:16px; }
    button:hover { background:#c9a227; }
    .flash { background:#c0392b; color:#fff; padding:10px; border-radius:5px; margin-bottom:15px; text-align:center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ACEest Fitness</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" required autofocus>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
